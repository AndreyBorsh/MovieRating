# ── nginx: как правильно отдавать WAW под /waw-movie ──
#
# Вставить этот location в server-блок, который слушает makuku.ddns.net.
#
# ВАЖНО, два правила (иначе будет 404 без стилей):
#   1) proxy_pass БЕЗ слэша в конце  → префикс /waw-movie НЕ срезается и
#      доходит до приложения (Next собран с basePath=/waw-movie и ждёт его).
#   2) НИКАКОГО sub_filter. Он рассчитан на приложения без basePath и с Next
#      не работает: Next догружает JS-чанки в рантайме по путям, которые
#      sub_filter не видит, поэтому чанки всё равно 404. Приложение уже само
#      отдаёт все пути (страницы, _next, api, картинки) с префиксом /waw-movie.
#
# То есть от прокси нужно ровно одно: передать запрос как есть, не трогая путь.

location /waw-movie {
    proxy_pass http://host.docker.internal:3000;   # ← БЕЗ слэша в конце
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
